<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Full-Stack Engineer, backend-leaning. Building complete products end-to-end — UI through API to database and deployment. Remote (UTC+1)."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Mohammed Zaariri — Full-Stack Engineer</title>
    <!--
      No-flash theme bootstrap. Runs before React paints so the correct theme
      class is on <html> immediately. Order: saved choice → OS preference → dark.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
