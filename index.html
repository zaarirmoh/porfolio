<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mohamed Rayan Zaarir — full-stack engineer building production-grade web platforms end to end, from databases and APIs to modern React interfaces. Based in Algeria (UTC+1)."
    />
    <meta name="author" content="Mohamed Rayan Zaarir" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />

    <!-- Social sharing (Open Graph + Twitter).
         TODO after deploy: replace og:url / og:image with your absolute domain,
         e.g. https://yourdomain.dev and https://yourdomain.dev/og.png -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohamed Rayan Zaarir — Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Full-stack engineer specializing in scalable backend architecture and modern web apps. Building production platforms end to end, based in Algeria."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohamed Rayan Zaarir — Full-Stack Engineer" />
    <meta
      name="twitter:description"
      content="Full-stack engineer specializing in scalable backend architecture and modern web apps. Building production platforms end to end, based in Algeria."
    />
    <meta name="twitter:image" content="/og.png" />

    <title>Mohamed Rayan Zaarir — Full-Stack Engineer</title>
    <!--
      No-flash theme bootstrap. Runs before React paints so the correct theme
      class is on <html> immediately. Order: saved choice → OS preference → dark.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
